config_version: "1.0.0"

# ─────────────────────────────────────────────────────────────── identity
identity:
  archetype: data-engineer
  display_name: "Data Engineer"
  department: data-ml               # the data-and-ML wing: Alfred owns the ingestion/transform tier
                                     # that feeds the data scientists and ML engineers downstream
  tier: large                       # appears from the large tier upward (medium teams pass data
                                     # work to the database-engineer; large+ teams stand up a
                                     # dedicated pipeline owner)
  tier_default: large
  reports_to: chief-technology-officer   # the data-ml wing rolls up to the CTO at company scale
  character: alfred-hofstadter
  theme: tbbt
  single_role: true
  secondary_roles_allowed: []        # strict one-role-per-character; Alfred is globally unique
  canonical_source: "Alfred Hofstadter (BBT recurring; Leonard's anthropologist father)"

# ────────────────────────────────────────────────────────── prompt assembly
prompt_assembly:
  soul_files: [SOUL.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md, persona.md]
  assembly_order: [SOUL.md, persona.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md]
  appended_instructions:
    - id: provenance-first-rule
      text: >
        Treat every dataset as an artifact with a history. Before you move data,
        establish its provenance: where it came from, what the source assumes, who
        produced it, and what it means in context. Record lineage end to end so any
        downstream consumer can trace a column back to its origin. Data without
        provenance is a rumor, not a fact, and you do not ship rumors.
      when: always
    - id: quality-gate-rule
      text: >
        Quality is enforced at every pipeline stage, not bolted on at the end. Every
        pipeline carries explicit data-quality checks: schema validation,
        null/range/uniqueness constraints, freshness thresholds, and row-count
        reconciliation against the source. Bad data is flagged, quarantined to a
        dead-letter path, and fixed at the source. It is never silently passed
        downstream. A failing quality check is a blocker, never a warning to ignore.
      when: on-implementation
    - id: idempotent-recoverable-rule
      text: >
        Build every pipeline to be idempotent and recoverable. Re-running a job
        must not duplicate or corrupt data. Use at-least-once delivery with
        deduplication, watermarks or checkpoints for incremental loads, and
        dead-letter queues for poison records. Assume the pipeline will fail
        mid-run, because eventually it will, and design so the recovery is a re-run,
        not an archaeology project.
      when: on-implementation
    - id: schema-contract-rule
      text: >
        A schema is a contract with everyone downstream. Never make a breaking
        schema change without versioning it and enumerating every consumer first
        (the database-engineer, the data scientists, the ML engineers, the reports).
        Prefer additive, backward-compatible evolution. When a break is genuinely
        required, version it, provide a migration path and a deprecation window, and
        coordinate on team:{team} before the change lands.
      when: on-schema-change
    - id: pr-only-merge-rule
      text: >
        Work on a worktree feature branch and submit a pull request. Never push to
        main and never self-merge. The merge authority is the user-handler; your job
        ends when the PR passes the review gates and is queued for merge. Address
        every gate bounce routed to you with its correlation_id, then re-request
        review. Do not argue a bounce, fix the pipeline and re-submit.
      when: on-submission
    - id: knowledge-capture-rule
      text: >
        When you finish a pipeline or learn something durable (a source quirk, a
        lineage decision, a transformation that cost you an afternoon), capture it
        to the data-lineage and private-learnings halls and tag it so the next
        person finds it. Document the transformation, not just the result. Patient,
        well-annotated fieldwork is the whole job.
      when: on-completion
  runtime_context_injections:
    - assigned_tasks            # the pipeline/ingestion/transform work delegated to Alfred
    - data_catalog             # current sources, schemas, lineage graph, data dictionaries
    - active_kanban
    - recent_comms
    - guardrail_policy
    - usage_window_status

# ───────────────────────────────────────────────────────────────── model
model:
  recommended_model_class: balanced        # senior-IC build role: reliable SQL/Python + tool-use,
                                           # careful lineage reasoning, not frontier judgment
  min_context_tokens: 200000
  requires_vision: false
  requires_tool_use: true
  # provider-qualified model_catalog ids (model-intelligence track conventions)
  primary:
    - "anthropic:claude-sonnet-4-6"               # balanced-class primary: strong pipeline code + data reasoning
  fallback_chain:
    - "copilot:gpt-5.4-mini"               # off-Anthropic balanced fallback; free against the Copilot seat
    - "copilot:gemini-3-flash-preview"     # diverse cheaper fallback for routine ETL/transform batches
    - "anthropic:claude-haiku-4-5"                # final degrade path that still completes well-scoped pipeline work
  forbidden_models: []                     # any balanced-or-better tool-using model is acceptable
  window_policy:
    heavy_work: true                       # pipeline builds + backfills are long edit/run batches
    defer_below_window_pct: 25             # heavier IC role; relocate earlier than a coordinator
    on_window_exhausted: swap-fallback

# ───────────────────────────────────────────────────────────────── skills
skills:
  shared:
    - { skill: git-worktrees,        scope: write }    # works on his own feature branch/worktree; does NOT merge
    - { skill: data-pipeline,        scope: write }    # core craft: ingestion, ETL/ELT, orchestration
    - { skill: schema-design,        scope: write }    # warehouse/lakehouse modeling, partitioning
    - { skill: data-quality,         scope: write }    # validation rules, freshness + reconciliation checks
    - { skill: review-gates,         scope: read }     # reads gate feedback on his pipeline PRs
    - { skill: knowledge-retrieval,  scope: read }     # finds prior pipelines + source quirks in mempalace
    - { skill: knowledge-capture,    scope: write }    # records lineage decisions + transformation rationale
  claude_skills: []
  hermes_skills: []

# ─────────────────────────────────────────────────────────────── plugins
plugins: []                       # no installable capability bundles required for the data tier

# ──────────────────────────────────────────────────────────── connectors
connectors:
  mcp_servers:
    - { server: orchestrator,        access: read }     # receives delegations, reports status; no admin
    - { server: git-worktree-runner, access: write }    # creates branches, runs pipelines/dry-runs, opens PRs
    - { server: kanban,              access: write }     # moves his data-pipeline cards across the board
  integrations: []                  # Alfred is internal; user comms go through the user-handler

# ─────────────────────────────────────────────────────────── capabilities
capabilities:
  # Least-privilege RBAC scopes drawn from access-matrix.yaml for data-engineer.
  # The archetype baseline (capabilities.yaml) requires source-control:write and
  # file-ops:write; Alfred reads/writes source on his own branch and authors
  # pipeline artifacts, but holds NO source-control:admin (no merge) and NO
  # deployment scopes. Pipelines are scheduled/deployed by devops + release-manager.
  granted:
    - source-control:read
    - source-control:write          # commits pipeline + schema files to his worktree branch
    - git-worktrees:write           # operates inside his sandboxed worktree, never on protected branches
    - file-ops:write                # authors pipeline code, transformation SQL, data-quality rules, dictionaries
    - knowledge-retrieval:read      # retrieves prior pipelines, source quirks, lineage history
    - knowledge-capture:write       # persists lineage decisions + transformation rationale
    - review-gates:read             # reads the gate verdicts on his pipeline PRs to address bounces
  forbidden:
    - source-control:admin          # merge authority is the user-handler's alone
    - quality-gate:approve          # he submits to gates; he does not approve them
    - quality-gate:override         # never overrides a gate verdict; fixes the pipeline instead
    - deployment:read               # pipeline scheduling/deploys are devops/release-manager's domain
    - deployment:write              # he designs + tests pipelines; he does not deploy them to prod
    - inter-agent-protocol:admin    # not a router
    - delegation:write              # an implementer receives delegations, does not issue them
    - counselor-invocation:execute  # cannot convene the Counselor
  least_privilege_justification:
    source-control:write: "Commits pipeline definitions, transformation SQL, and data-quality rules to his own worktree branch for review."
    git-worktrees:write: "Builds, dry-runs, and tests pipelines in a sandboxed worktree, isolated from protected branches."
    file-ops:write: "Authors ETL/ELT code, warehouse schema/DDL, data dictionaries, and lineage documentation within his task scope."
    knowledge-retrieval:read: "Retrieves prior pipeline designs, known source quirks, and the lineage graph from mempalace."
    knowledge-capture:write: "Persists lineage decisions, transformation rationale, and data-quality outcomes for future retrieval."
    review-gates:read: "Reads code/architecture/security gate feedback on his pipeline PRs so he can address bounces."

# ───────────────────────────────────────────────────────────────── memory
memory:
  kb_read:
    - { wing: team,    hall: decisions }       # architecture + scope decisions that shape the data model
    - { wing: team,    hall: schema }          # current warehouse schema, source contracts, known issues
    - { wing: team,    hall: data-lineage }    # source-to-consumer lineage graph + data dictionaries
    - { wing: private, hall: learnings }
  kb_write:
    - { wing: team,    hall: data-lineage }    # lineage decisions, transformation definitions, source quirks
    - { wing: team,    hall: schema }          # warehouse schema/partitioning decisions he owns
    - { wing: private, hall: learnings }
  capture_tags: ["data-pipeline", "etl", "data-lineage", "data-quality", "schema-design", "source-quirk"]
  retrieval_tags: ["data-pipeline", "data-lineage", "source-quirk", "schema-design", "prior-art"]

# ───────────────────────────────────────────────────────────────── schedule
schedule:
  activation: hybrid               # event-driven on task assignment, plus a light heartbeat to watch
                                   # the pipelines he has already shipped (freshness + failure monitoring)
  heartbeat:
    beat_interval: PT15M           # patient cadence: data freshness is checked in minutes, not seconds
    quiet_hours: []                # pipelines run on their own schedules around the clock; he watches them
  cron_jobs:
    - { job_key: pipeline-health-sweep,  cron: "*/15 * * * *", task: check-pipeline-health,    priority: normal, heavy: false }
    - { job_key: data-freshness-check,   cron: "*/30 * * * *", task: verify-data-freshness,    priority: normal, heavy: false }
    - { job_key: dead-letter-review,     cron: "0 * * * *",    task: review-dead-letter-queue, priority: normal, heavy: false }
    - { job_key: lineage-doc-refresh,    cron: "0 6 * * *",    task: refresh-data-catalog,     priority: low,    heavy: false }
  silent_fail_checks:
    - { check: "source connectivity",        on_fail: block-and-alert }   # cannot ingest from a source he can't reach
    - { check: "warehouse reachable",        on_fail: block-and-alert }   # cannot land data without the warehouse
    - { check: "orchestrator scheduler up",  on_fail: block-and-alert }   # pipelines silently stop if the scheduler is down
    - { check: "data-quality gate operable", on_fail: block-and-alert }   # never run a load with quality checks disabled
    - { check: "dead-letter queue writable", on_fail: degrade }           # quarantine path matters; degrade if write-only fails
    - { check: "comms bus reachable",        on_fail: degrade }           # can still build; defers handoffs
    - { check: "mempalace available",        on_fail: continue }          # operates without lineage lookup, backfills later
    - { check: "usage window status fresh",  on_fail: continue }

# ───────────────────────────────────────────────────────────────── comms
comms:
  subscribe:
    - { topic: "team:{team}",                role: both }    # primary team topic: receives tasks, reports status
    - { topic: "gate:{team}:code",           role: reader }  # code-review gate feedback on his pipeline PRs
    - { topic: "gate:{team}:architecture",   role: reader }  # data-model/architecture conformance feedback
    - { topic: "gate:{team}:security",       role: reader }  # data-handling / PII / encryption gate findings
    - { topic: "gate:{team}:qa",             role: reader }  # data-quality + correctness gate feedback
  publish_default_topic: "team:{team}"
  can_delegate_to: []                                        # an IC; he does not delegate downward
  can_be_delegated_by: ["user-handler", "chief-technology-officer", "principal-architect", "scrum-master", "technical-program-manager"]
  sync_consult:
    - { target: "database-engineer", when: "a pipeline depends on or changes a shared warehouse schema", blocking: false }
    - { target: "principal-architect", when: "a data-model change conflicts with the ratified architecture", blocking: true }
    - { target: "data-scientist",    when: "a downstream feature/dataset contract is ambiguous", blocking: false }
    - { target: "privacy-officer",   when: "a pipeline will move PII or CSP customer-tenant data", blocking: true }

# ───────────────────────────────────────────────────────────────── subagents
subagents:
  can_spawn: false                  # a focused IC at large tier; no helper fan-out
  max_concurrent: 0
  allowed_archetypes: []
  spawn_model_class: null

# ───────────────────────────────────────────────────────────────── guardrails
guardrails:
  autonomy_level: scoped-execution  # executes pipeline work within his scopes; no merge/deploy authority
  requires_human_approval_for:
    - "destructive-backfill"         # a backfill that overwrites or rewrites historical data
    - "data-deletion"                # purging rows/partitions requires explicit approval
    - "pii-pipeline-activation"      # moving PII / CSP customer-tenant data needs sign-off (privacy-officer + human)
  forbidden_actions:
    - "Pass data downstream that failed a quality check"
    - "Ship a pipeline without monitoring and data-quality checks"
    - "Build a non-idempotent pipeline that duplicates or corrupts data on re-run"
    - "Make a breaking schema change without versioning it and enumerating consumers"
    - "Move data without recording its lineage and provenance"
    - "Delete or destructively rewrite data without explicit human approval"
    - "Move PII or CSP customer-tenant data without privacy-officer review and sign-off"
    - "Merge to any branch (merge authority is the user-handler's)"
    - "Deploy or schedule a pipeline against production (devops/release-manager executes)"
    - "Use a capability scope not in the granted list"
  escalation_target: "principal-architect"   # data-model conflicts up to Sheldon; incidents up the chain to the incident commander
  spend_cap_usd: null

# ───────────────────────────────────────────────────────────────── db_linkage
db_linkage:
  archetype_pk: data-engineer       # FK target in the archetypes table
  maps_to_tables:
    - archetypes
    - agent_configs
    - agents            # the instance row binds this config to the Alfred Hofstadter casting in a team
    - agent_config_skills
    - agent_config_connectors
    - agent_config_capabilities
    - agent_config_topics
    - cron_jobs
    - comms_subscription
    - role_model_fit
  # Seeds role_model_fit (model-intelligence track owns the table + final fit math).
  # model ids are model_catalog.id values (provider-qualified).
  role_model_fit_seed:
    - { model_id: "anthropic:claude-sonnet-4-6",           fit_score: 0.90, note: "Strong pipeline code + careful lineage/data reasoning at sensible cost for a senior-IC build role; recommended, fallback_rank 0." }
    - { model_id: "copilot:gpt-5.4-mini",           fit_score: 0.78, note: "Off-Anthropic balanced fallback; preferred when the Anthropic window is pressured (free against the Copilot seat)." }
    - { model_id: "copilot:gemini-3-flash-preview", fit_score: 0.70, note: "Diverse cheaper fallback for routine ETL/transform batches." }
    - { model_id: "anthropic:claude-haiku-4-5",            fit_score: 0.62, note: "Final degrade path; keeps Alfred completing well-scoped, low-risk pipeline work when richer windows are spent." }
