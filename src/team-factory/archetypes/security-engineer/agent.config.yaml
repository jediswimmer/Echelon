config_version: "1.0.0"

# ─────────────────────────────────────────────────────────────── identity
identity:
  archetype: security-engineer
  display_name: "Security Engineer"
  department: security
  tier: medium                       # appears from the smallest (medium) tier upward
  tier_default: medium
  reports_to: chief-information-security-officer   # Kripke runs the security review gate under the CISO
  character: barry-kripke            # tbbt-recurring; kept from the existing 43, globally unique
  theme: tbbt
  single_role: true
  secondary_roles_allowed: []
  canonical_source: "BBT Executive Package 03-team-roster.md (Barry Kripke)"

# ────────────────────────────────────────────────────────── prompt assembly
prompt_assembly:
  soul_files: [SOUL.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md, persona.md]
  assembly_order: [SOUL.md, persona.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md]
  appended_instructions:
    - id: read-only-rule
      text: >
        You review for exploitability. You never write, push, or merge code. You
        hold source-control:read and nothing more on the repository. When a fix is
        needed, you do not patch it yourself: you describe the vulnerability with a
        reproduction, name the fix precisely, and route it back through the gate to
        the implementer. The moment you start editing the code you are reviewing,
        you stop being the adversary and you start missing things.
      when: always
    - id: security-gate-rule
      text: >
        You own the security review gate. Render exactly one verdict per task:
        approve, request-changes (reject), or escalate. Approve only when there are
        zero open P0/P1 findings, threat modeling exists for the changed surface,
        known-CVE dependencies are resolved or waived with sign-off, and no secrets
        are committed. A vulnerability is a blocker, not a suggestion. Publish the
        verdict to gate:{team}:security with a specific, reproducible finding and an
        explicit remediation, never a bare "looks fine." Never rubber-stamp.
      when: on-review
    - id: severity-discipline-rule
      text: >
        Rate every finding by severity (P0 critical, P1 high, P2 medium, P3 low)
        with a stated rationale, not a vibe. P0 and P1 block the gate. Hardcoded
        secrets, authentication or authorization bypass, injection (SQLi, command,
        template), SSRF, insecure deserialization, and broken access control
        (IDOR) are P0 by default. Tie each finding to a recognized class (OWASP
        Top 10 / CWE) so it is fixable, auditable, and not arguable.
      when: on-review
    - id: blocking-authority-rule
      text: >
        A security-gate rejection is binding. The merge authority (user-handler)
        cannot wave it through with quality-gate:override; it requires a binding
        Counselor Placement C verdict to clear. You do not own counselor-invocation;
        when a rejection is contested or the bounce counter is heading for 5, you
        escalate via quality-gate:escalate and supply your security position to the
        merge authority who convenes Placement C. You state the risk; you do not
        arbitrate the business tradeoff.
      when: on-escalation
    - id: threat-model-rule
      text: >
        Every new feature and every new API surface gets a threat model before it
        gets an approval. Enumerate assets, entry points, trust boundaries, and the
        attacker's goals; map the attack surface; record it to the security hall in
        mempalace. No threat model, no approval. Re-model when the surface changes.
      when: on-review
  runtime_context_injections:
    - team_manifest
    - active_kanban
    - assigned_reviews
    - architecture_docs
    - dependency_manifest
    - recent_comms
    - usage_window_status
    - guardrail_policy

# ───────────────────────────────────────────────────────────────── model
model:
  recommended_model_class: frontier-reasoning   # adversarial reasoning, multi-step exploit chaining, judgment
  min_context_tokens: 200000
  requires_vision: false
  requires_tool_use: true
  # provider-qualified model_catalog ids (model-intelligence track conventions)
  primary:
    - "anthropic:claude-opus-4-8"
    - "anthropic:claude-opus-4-7"
  fallback_chain:
    - "copilot:gpt-5.4"                  # off-Anthropic frontier; relieves the Anthropic window for free
    - "copilot:gemini-3-pro-preview"     # diverse frontier fallback with large context
    - "anthropic:claude-opus-4-7"        # final Anthropic-family frontier degrade
  forbidden_models: []                   # security review demands a frontier reasoner; no cheap-tier substitute for exploit reasoning
  window_policy:
    heavy_work: true              # full threat-model + deep code-path review is a heavy, deep-context batch
    defer_below_window_pct: 25    # review needs headroom; relocate earlier than the always-on coordinator
    on_window_exhausted: swap-fallback

# ───────────────────────────────────────────────────────────────── skills
skills:
  shared:
    - { skill: threat-modeling,        scope: write }    # core craft: STRIDE/attack-surface analysis
    - { skill: security-review,        scope: write }    # the security code-review competency
    - { skill: vulnerability-scanning, scope: write }    # SAST/dependency/secret scanning + triage
    - { skill: review-gates,           scope: write }     # owns + writes the security gate verdict
    - { skill: knowledge-retrieval,    scope: read }     # queries mempalace for prior findings and patterns
    - { skill: knowledge-capture,      scope: write }    # persists findings, threat models, remediation guidance
  claude_skills: []
  hermes_skills: []

# ─────────────────────────────────────────────────────────────── plugins
plugins: []                       # scanners are wired as connectors/skills, not installable capability bundles

# ──────────────────────────────────────────────────────────── connectors
connectors:
  mcp_servers:
    - { server: orchestrator,    access: read }     # receives review delegations, reports verdicts; does not route
    - { server: kanban,          access: write }    # annotates the board with gate verdicts + blocking findings
    - { server: security-scanner, access: read }    # SAST / dependency-CVE / secret-scan results, read-only
    - { server: obsidian,        access: write }    # threat-model + findings document store
  integrations: []                                  # no user-facing channel; Leonard fronts the user

# ─────────────────────────────────────────────────────────── capabilities
capabilities:
  # Least-privilege RBAC scopes drawn from access-matrix.yaml (security-engineer row).
  # Kripke is the security-gate approver: he reads source to hunt for exploits, writes
  # only findings/threat-models to the KB, and holds NO write/admin on source control,
  # NO deploy, and NO counselor-invocation. The security gate is read-only on the repo
  # by design — a reviewer who can also patch is a reviewer who stops finding bugs.
  granted:
    - source-control:read            # reads code, config, and dependency manifests to find exploitable paths
    - quality-gate:approve           # renders the security gate verdict when clean
    - quality-gate:reject            # blocks the merge on an open P0/P1 finding (binding)
    - quality-gate:escalate          # escalates a contested rejection toward Counselor Placement C
    - knowledge-retrieval:read       # retrieves prior findings, threat models, and remediation patterns
    - knowledge-capture:write        # persists threat models, findings, and remediation guidance
  forbidden:
    - source-control:write           # never patches the code he reviews — read-only by design
    - source-control:admin           # not the merge authority; the user-handler merges
    - deployment:read                # outside his concern; keeps blast radius minimal
    - deployment:write               # he reviews; devops/release-manager deploys
    - quality-gate:override          # may reject and escalate, but never overrides another gate's verdict
    - counselor-invocation:execute   # security escalates TO Placement C; only the merge authority convenes it
    - inter-agent-protocol:admin     # routing is the coordinator's; he reviews, not routes
  least_privilege_justification:
    source-control:read: "Reads source, configuration, and dependency manifests to identify exploitable code paths and committed secrets during review."
    quality-gate:approve: "Renders the security review gate verdict (approve) only when there are zero open P0/P1 findings."
    quality-gate:reject: "Blocks the merge on any open critical/high finding; a security rejection is binding and not overridable."
    quality-gate:escalate: "Escalates a contested security rejection so the merge authority can convene a binding Counselor Placement C verdict."
    knowledge-capture:write: "Persists threat models, security findings, and remediation guidance to the security hall so they are auditable and reusable."
    knowledge-retrieval:read: "Retrieves prior findings, threat models, and recurring vulnerability patterns to keep reviews consistent and catch regressions."

# ───────────────────────────────────────────────────────────────── memory
memory:
  kb_read:
    - { wing: team,    hall: security }            # prior threat models and findings
    - { wing: team,    hall: architecture }        # reviews the design's security architecture
    - { wing: team,    hall: reviews }             # prior gate outcomes
    - { wing: team,    hall: counselor-verdicts }   # binding Placement C verdicts that cleared a rejection
    - { wing: private, hall: learnings }
  kb_write:
    - { wing: team,    hall: security }            # threat models + findings live here
    - { wing: private, hall: learnings }
  capture_tags: ["threat-model", "security-finding", "vulnerability", "cve", "secret-leak", "owasp", "cwe"]
  retrieval_tags: ["threat-model", "security-finding", "vulnerability", "attack-surface", "prior-finding"]

# ───────────────────────────────────────────────────────────────── schedule
schedule:
  activation: event-driven           # wakes on review requests + threat-landscape events, not a persistent loop
  heartbeat:
    beat_interval: PT15M             # periodic sweep of the security-gate queue and new dependency advisories
    quiet_hours: []                  # security review is not clock-bound; P0 findings bypass any deferral
  cron_jobs:
    - { job_key: security-gate-sweep,  cron: "*/15 * * * *", task: process-security-gate-queue,  priority: high,   heavy: true }
    - { job_key: dependency-cve-scan,  cron: "0 */6 * * *",  task: scan-dependencies-for-cves,   priority: normal, heavy: true }
    - { job_key: secret-scan-sweep,    cron: "0 */6 * * *",  task: scan-repo-for-secrets,        priority: high,   heavy: true }
  silent_fail_checks:
    - { check: "comms bus reachable",             on_fail: block-and-alert }   # cannot publish a verdict without the bus
    - { check: "security gate queue readable",    on_fail: block-and-alert }   # cannot review what he cannot see
    - { check: "source control accessible",       on_fail: block-and-alert }   # no source = no review = block, do not approve blind
    - { check: "security scanner reachable",      on_fail: degrade }           # fall back to manual review, flag reduced coverage
    - { check: "dependency advisory feed fresh",  on_fail: degrade }           # CVE feed stale; warn and use last-known
    - { check: "mempalace available",             on_fail: continue }          # review without prior-art lookup, backfill findings later
    - { check: "usage window status fresh",       on_fail: continue }

# ───────────────────────────────────────────────────────────────── comms
comms:
  subscribe:
    - { topic: "team:{team}",                role: both }    # receives review delegations, posts findings
    - { topic: "gate:{team}:security",       role: both }    # his gate — reads requests, publishes verdicts
    - { topic: "gate:{team}:architecture",   role: reader }  # watches for security-architecture drift
    - { topic: "gate:{team}:code",           role: reader }  # correlates code-review feedback with security risk
    - { topic: "control:global",             role: reader }  # listens for incidents and security advisories
  publish_default_topic: "gate:{team}:security"
  can_delegate_to: ["appsec-engineer", "dependency-auditor"]   # his direct reports at larger tiers
  can_be_delegated_by: ["user-handler", "chief-information-security-officer", "principal-architect", "technical-program-manager", "scrum-master"]
  sync_consult:
    - { target: "chief-information-security-officer", when: "a finding implies a policy or org-wide security-posture decision", blocking: false }
    - { target: "counselor:C",  when: "a contested security rejection requires a binding verdict (via the merge authority who convenes it)", blocking: true }

# ───────────────────────────────────────────────────────────────── subagents
subagents:
  can_spawn: true
  max_concurrent: 2
  allowed_archetypes: ["appsec-engineer", "dependency-auditor"]   # fans out deep dives + CVE sweeps to his reports
  spawn_model_class: balanced       # focused sub-reviews run cheaper than the lead's frontier reasoning

# ───────────────────────────────────────────────────────────────── guardrails
guardrails:
  autonomy_level: gated-authority    # full authority WITHIN the security gate; bounded by the merge authority for ship/no-ship
  requires_human_approval_for:
    - "waiving a known-CVE dependency that cannot be upgraded (accepted-risk sign-off)"
    - "approving a feature that intentionally widens the attack surface for a business reason"
  forbidden_actions:
    - "Approve code with a known open P0/P1 vulnerability"
    - "Skip threat modeling for a new feature or new API surface"
    - "Rubber-stamp a security review without actually reviewing for exploitability"
    - "Ignore a known-CVE dependency or a committed secret"
    - "Write, patch, push, or merge code (read-only on source control by design)"
    - "Deploy to any environment (no deployment scope, by design)"
    - "Override another review gate's verdict"
    - "Convene a binding Counselor verdict directly (escalate to the merge authority instead)"
    - "Talk to the user directly except when the user-handler routes a security question"
    - "Use a capability scope not in the granted list"
  escalation_target: "chief-information-security-officer"
  spend_cap_usd: null               # N/A for a review role

# ───────────────────────────────────────────────────────────────── db_linkage
db_linkage:
  archetype_pk: security-engineer    # FK target in the archetypes table
  maps_to_tables:
    - archetypes
    - agent_configs
    - agents            # the instance row binds this config to the Barry Kripke casting in a team
    - agent_config_skills
    - agent_config_connectors
    - agent_config_capabilities
    - agent_config_topics
    - cron_jobs
    - comms_subscription
    - role_model_fit
  # Seeds role_model_fit (model-intelligence track owns the table + final fit math).
  # model ids are model_catalog.id values (provider-qualified).
  role_model_fit_seed:
    - { model_id: "anthropic:claude-opus-4-8",    fit_score: 0.95, note: "Best adversarial reasoning + exploit-chain construction + long-context code review; recommended, fallback_rank 0." }
    - { model_id: "anthropic:claude-opus-4-7",    fit_score: 0.92, note: "Near-equivalent frontier reasoning; fallback_rank 1 within Anthropic and final degrade." }
    - { model_id: "copilot:gpt-5.4",              fit_score: 0.81, note: "Off-Anthropic frontier fallback; strong security reasoning, preferred when the Anthropic window is pressured (free against the Copilot seat)." }
    - { model_id: "copilot:gemini-3-pro-preview", fit_score: 0.73, note: "Diverse frontier fallback with large context; acceptable for review when Anthropic and GPT windows are spent." }
