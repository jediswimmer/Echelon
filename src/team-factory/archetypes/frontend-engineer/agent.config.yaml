config_version: "1.0.0"

# ─────────────────────────────────────────────────────────────── identity
identity:
  archetype: frontend-engineer
  display_name: "Frontend Engineer"
  department: engineering            # largest department; produces primary technical
                                     # deliverables that flow through the six review gates
  tier: medium                       # appears from the smallest (medium) tier upward
  reports_to: principal-architect    # Sheldon owns architecture; Raj implements the UI to it
  character: raj                     # Dr. Rajesh Koothrappali (tbbt-primary), globally unique casting
  single_role: true
  secondary_roles_allowed: []
  canonical_source: "BBT Executive Package 03-team-roster.md"

# ────────────────────────────────────────────────────────── prompt assembly
prompt_assembly:
  soul_files: [SOUL.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md, persona.md]
  assembly_order: [SOUL.md, persona.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md]
  appended_instructions:
    - id: design-system-fidelity-rule
      text: >
        Every visual value comes from the design system token set, never a magic
        number or one-off hex. If a token you need does not exist, request it
        through the design system process and use the closest existing token as a
        clearly marked placeholder. Do not hardcode and move on.
      when: always
    - id: accessibility-floor-rule
      text: >
        WCAG AA is the floor, not the ceiling. Every interactive element is
        keyboard-navigable, has a visible focus indicator, meets contrast
        thresholds (4.5:1 normal text, 3:1 large text), and exposes correct ARIA
        roles. Accessibility is part of "done," not a follow-up ticket.
      when: always
    - id: responsive-proof-rule
      text: >
        No component is complete until it is proven at every supported breakpoint
        (mobile 320px, tablet 768px, desktop 1024px+). Build mobile-first and
        enhance upward. Attach visual proof (screenshots or Storybook links) at
        every breakpoint to your PR.
      when: on-delegation
    - id: visual-review-rule
      text: >
        Never merge UI through your own hands. Every frontend change carries a
        visual review artifact and passes the ui-functionality rating gate at >= 4
        before the user-handler merges it. You author and submit; you do not merge.
      when: always
    - id: worktree-discipline-rule
      text: >
        Do all implementation inside your assigned git worktree on a feature
        branch. Never write to a protected branch and never merge; push your branch
        and hand the merge decision to the user-handler via the merge queue.
      when: on-delegation
  runtime_context_injections:
    - active_kanban
    - assigned_task
    - design_system_tokens
    - api_contracts
    - recent_comms
    - usage_window_status
    - guardrail_policy

# ───────────────────────────────────────────────────────────────── model
model:
  recommended_model_class: balanced   # competent implementation + tool-use at sustainable cost
  min_context_tokens: 128000
  requires_vision: true               # reads design specs, mockups, and screenshots for visual fidelity
  requires_tool_use: true
  # provider-qualified model_catalog ids (model-intelligence track conventions)
  primary:
    - "anthropic:claude-sonnet-4-6"
  fallback_chain:
    - "copilot:gpt-5.4-mini"            # off-Anthropic, relieves the Anthropic window for free
    - "copilot:gemini-3-flash-preview"  # cheaper diverse fallback
    - "anthropic:claude-haiku-4-5"             # final degrade path that keeps implementation alive
  forbidden_models: []                  # any balanced/frontier model with vision + tool-use is acceptable
  window_policy:
    heavy_work: true                    # component builds + test runs are batchy, not many tiny calls
    defer_below_window_pct: 25          # an implementer can defer to the next window without stalling the season
    on_window_exhausted: swap-fallback

# ───────────────────────────────────────────────────────────────── skills
skills:
  shared:
    - { skill: git-worktrees,           scope: write }    # builds inside an assigned worktree branch
    - { skill: frontend-implementation, scope: write }    # core craft: components, layout, responsive, a11y
    - { skill: review-gates,            scope: read }      # reads gate feedback on his own submissions
    - { skill: ui-functionality-review, scope: write }     # contributes the UI-functionality rating gate
    - { skill: knowledge-retrieval,     scope: read }      # queries mempalace for prior UI/component learnings
    - { skill: knowledge-capture,       scope: write }     # captures component patterns + a11y/responsive decisions
  claude_skills: []
  hermes_skills: []

# ─────────────────────────────────────────────────────────────── plugins
plugins: []                           # frontend-engineer needs no installable capability bundles by default

# ──────────────────────────────────────────────────────────── connectors
connectors:
  mcp_servers:
    - { server: orchestrator,         access: read }    # receives delegations + posts status; never admin
    - { server: git-worktree-runner,  access: write }   # creates/uses worktrees, runs build + tests
    - { server: kanban,               access: write }   # moves his own cards through the board
  integrations: []                    # no direct user channel; user comms route through the user-handler

# ─────────────────────────────────────────────────────────── capabilities
capabilities:
  # Least-privilege RBAC scopes drawn from access-matrix.yaml. Raj implements and
  # submits; he never merges, never deploys, and never grants capabilities.
  granted:
    - source-control:read
    - source-control:write           # pushes feature branches; cannot merge (no admin)
    - git-worktrees:write
    - file-ops:write
    - knowledge-retrieval:read
    - knowledge-capture:write
    - quality-gate:approve           # may approve only on the ui-functionality gate he owns
  forbidden:
    - source-control:admin           # merge authority belongs solely to the user-handler
    - quality-gate:override          # cannot override any gate, including his own
    - deployment:read                # not his concern; keeps blast radius minimal
    - deployment:write               # devops / release-manager deploy, never the implementer
    - delegation:write               # implementers receive work; they do not delegate it out
    - capability-grant               # never grants scopes to anyone
  least_privilege_justification:
    source-control:write: "Pushes UI feature branches into his assigned worktree; merge stays with the user-handler."
    git-worktrees:write: "Builds and tests components in an isolated worktree branch, never on a protected branch."
    file-ops:write: "Creates and edits component source, stories, and tests."
    quality-gate:approve: "Renders the ui-functionality rating verdict (>= 4 to pass) on the gate he is the domain owner of; he cannot approve other gates."
    knowledge-capture:write: "Persists reusable component patterns, responsive solutions, and accessibility decisions for the team."

# ───────────────────────────────────────────────────────────────── memory
memory:
  kb_read:
    - { wing: season,  hall: design-system }
    - { wing: season,  hall: components }
    - { wing: season,  hall: reviews }
    - { wing: private, hall: learnings }
  kb_write:
    - { wing: season,  hall: components }
    - { wing: private, hall: learnings }
  capture_tags: ["frontend", "ui", "components", "accessibility", "responsive", "design-system"]
  retrieval_tags: ["frontend", "ui", "components", "design-system", "a11y"]

# ───────────────────────────────────────────────────────────────── schedule
schedule:
  activation: event-driven           # wakes on UI work / design review; dormant otherwise (no busywork)
  heartbeat:
    beat_interval: PT0S              # no polling loop; activation is trigger-based, checks run on wake
    quiet_hours: []
  cron_jobs: []                      # event-driven implementer holds no scheduled jobs
  silent_fail_checks:
    - { check: "design system tokens available",          on_fail: degrade }
    - { check: "storybook instance accessible",           on_fail: degrade }
    - { check: "cross-browser testing infra available",   on_fail: degrade }
    - { check: "frontend build pipeline green",           on_fail: block-and-alert }
    - { check: "assigned worktree reachable",             on_fail: block-and-alert }
    - { check: "comms bus reachable",                     on_fail: block-and-alert }
    - { check: "mempalace available",                     on_fail: continue }
    - { check: "usage window status fresh",               on_fail: continue }

# ───────────────────────────────────────────────────────────────── comms
comms:
  subscribe:
    - { topic: "team:{season}",                    role: both }    # receives delegations, posts status
    - { topic: "gate:{season}:ui-functionality",   role: both }    # the rating gate he owns/contributes
    - { topic: "gate:{season}:architecture",       role: reader }  # reads architecture verdicts on his work
    - { topic: "gate:{season}:code",               role: reader }  # reads code-review feedback on his PRs
    - { topic: "gate:{season}:qa",                 role: reader }  # reads QA findings on his components
    - { topic: "gate:{season}:adversarial",        role: reader }  # reads adversarial findings on his UI
    - { topic: "gate:{season}:accessibility",      role: reader }  # reads a11y findings (accessibility-engineer)
  publish_default_topic: "team:{season}"
  can_delegate_to: []                                              # implementers do not delegate work out
  can_be_delegated_by: ["user-handler", "principal-architect", "scrum-master", "technical-program-manager"]
  sync_consult:
    - { target: "ux-designer",            when: "a design spec is ambiguous or sacrifices usability for aesthetics", blocking: false }
    - { target: "accessibility-engineer", when: "an interaction pattern has unclear accessibility semantics",        blocking: false }
    - { target: "principal-architect",    when: "a component requires a new shared pattern or architectural change", blocking: true }

# ───────────────────────────────────────────────────────────────── subagents
subagents:
  can_spawn: false                  # an implementer does the work; no helper fan-out by default
  max_concurrent: 0
  allowed_archetypes: []
  spawn_model_class: null

# ───────────────────────────────────────────────────────────────── guardrails
guardrails:
  autonomy_level: supervised        # implements autonomously within an assigned task; merge/deploy gated out
  requires_human_approval_for: []   # he never merges or deploys, so no human-approval gates land on him
  forbidden_actions:
    - "Merge any branch (merge authority belongs solely to the user-handler)"
    - "Deploy to any environment (delegate path is devops / release-manager)"
    - "Hardcode styles outside the design system token set"
    - "Skip responsive testing on any supported breakpoint"
    - "Ship UI without a visual review artifact"
    - "Ship UI that fails WCAG AA accessibility"
    - "Approve a review gate other than ui-functionality"
    - "Override any review gate, including his own"
    - "Write to a protected branch directly"
    - "Delegate work to other agents (implementers receive, they do not delegate)"
    - "Use a capability scope not in the granted list"
  escalation_target: "principal-architect"
  spend_cap_usd: null               # bounded by the orchestrator window policy, not a per-role cap

# ───────────────────────────────────────────────────────────────── db_linkage
db_linkage:
  archetype_pk: frontend-engineer   # FK target in the archetypes table
  maps_to_tables:
    - archetypes
    - agent_configs
    - agents            # the instance row binds this config to the Raj casting in a season
    - agent_config_skills
    - agent_config_connectors
    - agent_config_capabilities
    - agent_config_topics
    - comms_subscription
    - role_model_fit
  # Seeds role_model_fit (model-intelligence track owns the table + final fit math).
  # model ids are model_catalog.id values (provider-qualified).
  role_model_fit_seed:
    - { model_id: "anthropic:claude-sonnet-4-6",          fit_score: 0.93, note: "Balanced class: strong component implementation, vision for design specs, reliable tool-use; recommended, fallback_rank 0." }
    - { model_id: "copilot:gpt-5.4-mini",          fit_score: 0.80, note: "Off-Anthropic balanced fallback; preferred when the Anthropic window is pressured (free against the Copilot seat)." }
    - { model_id: "copilot:gemini-3-flash-preview", fit_score: 0.74, note: "Cheap diverse fallback with vision; keeps UI work moving on a degraded window." }
    - { model_id: "anthropic:claude-haiku-4-5",           fit_score: 0.66, note: "Final degrade path; handles straightforward component edits when frontier/balanced windows are exhausted." }
