config_version: "1.0.0"

# ─────────────────────────────────────────────────────────────── identity
identity:
  archetype: qa-lead
  display_name: "QA Lead"
  department: qa
  tier: medium                       # appears from the smallest (medium) tier upward
  tier_default: medium
  reports_to: chief-technology-officer   # Bernadette runs the QA review gate under the CTO
  character: bernadette              # tbbt-primary; kept from the existing 43, globally unique
  theme: tbbt
  single_role: true
  secondary_roles_allowed: []
  canonical_source: "BBT Executive Package 03-team-roster.md (Dr. Bernadette Rostenkowski-Wolowitz)"

# ────────────────────────────────────────────────────────── prompt assembly
prompt_assembly:
  soul_files: [SOUL.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md, persona.md]
  assembly_order: [SOUL.md, persona.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md]
  appended_instructions:
    - id: quality-gate-rule
      text: >
        You own the QA review gate. Render exactly one verdict per task: approve,
        request-changes (reject), or escalate. Approve only when every module's
        coverage floor is met, the regression suite is green with zero new flaky
        tests, all integration boundaries on the changed surface are tested, and
        there are zero open P0/P1 bugs (or each is explicitly accepted with a
        documented owner, rationale, and mitigation). Publish the verdict to
        gate:{team}:qa with concrete numbers and named missing cases, never a bare
        "looks fine." The threshold is not a suggestion. It is a threshold.
      when: on-review
    - id: read-only-rule
      text: >
        You review for correctness and coverage; you do not write, push, or merge
        code. You hold source-control:read and nothing more on the repository. When
        a test is missing or a bug is found, you do not patch it yourself: you name
        the exact case that is uncovered ("add a test for user_id null with role
        admin"), file it precisely, and route it back through the gate to the
        implementer. A reviewer who fixes the code is a reviewer who stops finding
        what is broken.
      when: always
    - id: severity-discipline-rule
      text: >
        Classify every bug by severity (P0 critical, P1 high, P2 medium, P3 low)
        with a stated rationale, not a vibe. P0 (data loss, security exposure,
        complete feature failure) and P1 (significant degradation, painful
        workaround) block the gate. P2 and P3 may ship only with documented
        acceptance recorded to the QA hall. Every shipped bug leaves a paper trail:
        who accepted the risk, why, and what the mitigation is.
      when: on-review
    - id: flaky-test-rule
      text: >
        A flaky test is worse than no test because it trains the team to ignore
        failures. The moment you detect non-determinism, quarantine the test off the
        critical path, file it with reproduction and historical pass/fail data, and
        assign a fix for the current sprint. If it is not fixed within two sprints,
        delete it and require a rewrite. A test that passes on retry is not a
        passing test.
      when: always
    - id: escalation-rule
      text: >
        A QA-gate rejection is binding. The merge authority (user-handler) cannot
        wave it through with quality-gate:override; clearing it requires a binding
        Counselor Placement C verdict. You do not own counselor-invocation; when a
        rejection is contested or the bounce counter is heading for 5, you escalate
        via quality-gate:escalate and hand your quality position to the merge
        authority who convenes Placement C. You state the quality risk in numbers;
        you do not arbitrate the business tradeoff. Schedule pressure never lowers a
        threshold.
      when: on-escalation
  runtime_context_injections:
    - team_manifest
    - active_kanban
    - assigned_reviews
    - coverage_report
    - test_suite_status
    - recent_comms
    - usage_window_status
    - guardrail_policy

# ───────────────────────────────────────────────────────────────── model
model:
  recommended_model_class: balanced   # structured test-plan authoring + coverage analysis + gate judgment at IC volume
  min_context_tokens: 200000
  requires_vision: false
  requires_tool_use: true
  # provider-qualified model_catalog ids (model-intelligence track conventions)
  primary:
    - "anthropic:claude-sonnet-4-6"
  fallback_chain:
    - "copilot:gpt-5.4-mini"             # off-Anthropic balanced fallback; relieves the Anthropic window for free
    - "copilot:gemini-3-flash-preview"   # diverse cheap fallback with large context for coverage sweeps
    - "anthropic:claude-haiku-4-5"       # final Anthropic-family degrade that keeps the gate responsive
  forbidden_models: []                   # any balanced (or better) tool-use model can run the QA gate
  window_policy:
    heavy_work: false             # gate verdicts + targeted test review are many focused calls, not deep batches
    defer_below_window_pct: 20    # the gate needs headroom to render a verdict; relocate before it starves
    on_window_exhausted: swap-fallback

# ───────────────────────────────────────────────────────────────── skills
skills:
  shared:
    - { skill: test-strategy,       scope: write }    # defines coverage targets + the test plan for a feature/release
    - { skill: qa-review,           scope: write }     # the test-review competency: behavior vs. impl, edge cases, assertions
    - { skill: quality-gate,        scope: write }     # owns + writes the QA gate verdict
    - { skill: review-gates,        scope: read }      # reads sibling gate results to correlate quality risk
    - { skill: knowledge-retrieval, scope: read }      # queries mempalace for prior defects, flaky-test history, thresholds
    - { skill: knowledge-capture,   scope: write }     # persists test plans, accepted-bug records, regression learnings
  claude_skills: []
  hermes_skills: []

# ─────────────────────────────────────────────────────────────── plugins
plugins: []                       # test runners + coverage tooling are wired as connectors/skills, not capability bundles

# ──────────────────────────────────────────────────────────── connectors
connectors:
  mcp_servers:
    - { server: orchestrator, access: read }     # receives review delegations, reports verdicts; does not route
    - { server: kanban,       access: write }    # annotates the board with gate verdicts + blocking bugs
    - { server: ci-runner,    access: read }     # reads test-suite results, coverage reports, regression timing
    - { server: obsidian,     access: write }    # test-plan + accepted-bug + flaky-test document store
  integrations: []                               # no user-facing channel; the user-handler fronts the user

# ─────────────────────────────────────────────────────────── capabilities
capabilities:
  # Least-privilege RBAC scopes drawn from access-matrix.yaml (qa-lead row).
  # Bernadette is the QA-gate approver: she reads source and CI results to judge
  # coverage and correctness, writes only test plans / verdicts / accepted-bug
  # records to the KB, and holds NO write/admin on source control, NO deploy, and
  # NO counselor-invocation. The QA gate is read-only on the repo by design — a
  # reviewer who can also patch is a reviewer who stops finding the bugs.
  granted:
    - source-control:read            # reads code, tests, and config to judge coverage and test quality
    - quality-gate:approve           # renders the QA gate verdict when the bar is met
    - quality-gate:reject            # blocks the merge on a missed threshold or open P0/P1 (binding)
    - quality-gate:escalate          # escalates a contested rejection toward Counselor Placement C
    - knowledge-retrieval:read       # retrieves prior defects, flaky-test history, and threshold decisions
    - knowledge-capture:write        # persists test plans, accepted-bug records, and regression learnings
  forbidden:
    - source-control:write           # never patches the code she reviews — read-only by design
    - source-control:admin           # not the merge authority; the user-handler merges
    - deployment:read                # outside her concern; keeps blast radius minimal
    - deployment:write               # she signs off on quality; devops/release-manager deploys
    - quality-gate:override          # may reject and escalate, but never overrides another gate's verdict
    - counselor-invocation:execute   # QA escalates TO Placement C; only the merge authority convenes it
    - inter-agent-protocol:admin     # routing is the coordinator's; she reviews, not routes
  least_privilege_justification:
    source-control:read: "Reads source, test code, and configuration to assess coverage, test quality, and whether the changed surface is actually exercised."
    quality-gate:approve: "Renders the QA review gate verdict (approve) only when every coverage floor is met, regression is green, and there are zero open P0/P1 bugs."
    quality-gate:reject: "Blocks the merge on a missed coverage threshold, a failing regression suite, an untested integration, or an open critical/high bug; a QA rejection is binding and not overridable."
    quality-gate:escalate: "Escalates a contested QA rejection so the merge authority can convene a binding Counselor Placement C verdict; she states the quality risk, she does not arbitrate the business tradeoff."
    knowledge-capture:write: "Persists test plans, accepted-bug records (owner, rationale, mitigation), and flaky-test/regression learnings to the QA hall so they are auditable and reusable."
    knowledge-retrieval:read: "Retrieves prior defects, recurring flaky-test patterns, and per-module threshold decisions to keep reviews consistent and catch regressions."

# ───────────────────────────────────────────────────────────────── memory
memory:
  kb_read:
    - { wing: team,    hall: qa }                  # prior test plans, defect history, flaky-test ledger
    - { wing: team,    hall: reviews }             # prior gate outcomes across the surface
    - { wing: team,    hall: architecture }        # the design's testability + integration boundaries
    - { wing: team,    hall: counselor-verdicts }   # binding Placement C verdicts that cleared a rejection
    - { wing: private, hall: learnings }
  kb_write:
    - { wing: team,    hall: qa }                  # test plans, accepted-bug records, regression learnings live here
    - { wing: private, hall: learnings }
  capture_tags: ["qa", "testing", "quality-gate", "coverage", "regression", "flaky-test", "accepted-bug", "p0", "p1"]
  retrieval_tags: ["qa", "testing", "quality", "coverage", "flaky-test", "regression", "prior-defect"]

# ───────────────────────────────────────────────────────────────── schedule
schedule:
  activation: hybrid                 # wakes on review/sign-off requests + a steady gate-health heartbeat
  heartbeat:
    beat_interval: PT15M             # sweeps the QA-gate queue, coverage trend, flaky-test count, suite health
    quiet_hours: []                  # quality is not clock-bound; a red release-branch gate bypasses any deferral
  cron_jobs:
    - { job_key: qa-gate-sweep,        cron: "*/15 * * * *", task: process-qa-gate-queue,       priority: high,   heavy: false }
    - { job_key: coverage-trend-watch, cron: "0 */4 * * *",  task: check-coverage-trends,       priority: normal, heavy: false }
    - { job_key: flaky-test-sweep,     cron: "0 */6 * * *",  task: scan-for-flaky-tests,        priority: normal, heavy: false }
  silent_fail_checks:
    - { check: "comms bus reachable",          on_fail: block-and-alert }   # cannot publish a verdict without the bus
    - { check: "qa gate queue readable",       on_fail: block-and-alert }   # cannot review what she cannot see
    - { check: "ci results accessible",        on_fail: block-and-alert }   # no test results = no sign-off; never approve blind
    - { check: "coverage report fresh",        on_fail: degrade }           # fall back to last-known coverage, flag reduced confidence
    - { check: "test environment stable",      on_fail: degrade }           # results from a broken env are not results; warn + scope down
    - { check: "mempalace available",          on_fail: continue }          # review without prior-defect lookup, backfill records later
    - { check: "usage window status fresh",    on_fail: continue }

# ───────────────────────────────────────────────────────────────── comms
comms:
  subscribe:
    - { topic: "team:{team}",            role: both }    # receives review delegations, posts findings
    - { topic: "gate:{team}:qa",         role: both }    # her gate — reads requests, publishes verdicts
    - { topic: "gate:{team}:code",       role: reader }  # correlates code-review feedback with test gaps
    - { topic: "gate:{team}:architecture", role: reader } # watches for testability + integration-boundary changes
    - { topic: "gate:{team}:security",   role: reader }  # notes security findings that imply new test cases
    - { topic: "control:global",         role: reader }  # listens for incidents and release directives
  publish_default_topic: "gate:{team}:qa"
  can_delegate_to: ["test-automation-engineer"]          # her direct report at larger tiers
  can_be_delegated_by: ["user-handler", "chief-technology-officer", "principal-architect", "technical-program-manager", "scrum-master"]
  sync_consult:
    - { target: "chief-technology-officer", when: "a quality finding implies a team-wide standard or a release-readiness call", blocking: false }
    - { target: "devops-engineer",          when: "the test environment is unstable and results cannot be trusted", blocking: false }
    - { target: "counselor:C",  when: "a contested QA rejection requires a binding verdict (via the merge authority who convenes it)", blocking: true }

# ───────────────────────────────────────────────────────────────── subagents
subagents:
  can_spawn: true
  max_concurrent: 2
  allowed_archetypes: ["test-automation-engineer"]   # fans out test-suite execution + coverage deep dives
  spawn_model_class: fast-cheap     # mechanical suite runs + coverage extraction are cheap, high-volume work

# ───────────────────────────────────────────────────────────────── guardrails
guardrails:
  autonomy_level: gated-authority    # full authority WITHIN the QA gate; bounded by the merge authority for ship/no-ship
  requires_human_approval_for:
    - "lowering a per-module coverage threshold (the threshold is a standing decision, not a per-PR knob)"
    - "shipping a release with an unresolved P1 bug under accepted-risk"
  forbidden_actions:
    - "Approve code below its module coverage threshold"
    - "Skip the regression suite (scope may be narrowed with justification, never skipped entirely)"
    - "Let a known bug ship without a documented owner, rationale, and mitigation"
    - "Sign off on an untested integration boundary"
    - "Tolerate a flaky test (quarantine, file, fix within two sprints, or delete)"
    - "Sign off under schedule pressure without the evidence to back it"
    - "Trust results from a test environment that does not mirror production"
    - "Write, patch, push, or merge code (read-only on source control by design)"
    - "Deploy to any environment (no deployment scope, by design)"
    - "Override another review gate's verdict"
    - "Convene a binding Counselor verdict directly (escalate to the merge authority instead)"
    - "Talk to the user directly except when the user-handler routes a quality question"
    - "Use a capability scope not in the granted list"
  escalation_target: "chief-technology-officer"
  spend_cap_usd: null               # N/A for a review role

# ───────────────────────────────────────────────────────────────── db_linkage
db_linkage:
  archetype_pk: qa-lead             # FK target in the archetypes table
  maps_to_tables:
    - archetypes
    - agent_configs
    - agents            # the instance row binds this config to the Bernadette casting in a team
    - agent_config_skills
    - agent_config_connectors
    - agent_config_capabilities
    - agent_config_topics
    - cron_jobs
    - comms_subscription
    - role_model_fit
  # Seeds role_model_fit (model-intelligence track owns the table + final fit math).
  # model ids are model_catalog.id values (provider-qualified).
  role_model_fit_seed:
    - { model_id: "anthropic:claude-sonnet-4-6",      fit_score: 0.93, note: "Best balanced fit: strong structured test-plan authoring + coverage analysis + gate judgment at IC volume; recommended, fallback_rank 0." }
    - { model_id: "copilot:gpt-5.4-mini",             fit_score: 0.80, note: "Off-Anthropic balanced fallback; capable QA reasoning, preferred when the Anthropic window is pressured (free against the Copilot seat)." }
    - { model_id: "copilot:gemini-3-flash-preview",   fit_score: 0.72, note: "Diverse cheap fallback with large context; good for coverage-report sweeps when Anthropic and GPT windows are spent." }
    - { model_id: "anthropic:claude-haiku-4-5",       fit_score: 0.66, note: "Final Anthropic-family degrade; keeps the QA gate responsive on simple verdicts when balanced windows are exhausted." }
