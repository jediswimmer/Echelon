config_version: "1.0.0"

# ─────────────────────────────────────────────────────────────── identity
identity:
  archetype: test-automation-engineer
  display_name: "Test Automation Engineer"
  department: qa                       # part of the quality org under the QA Lead
  tier: enterprise                     # appears only at the enterprise tier (full QA depth)
  tier_default: enterprise
  reports_to: qa-lead                  # the QA Lead owns the quality bar; Givens automates it
  character: hubert-givens
  theme: tbbt                          # company theme is tbbt; the casting is a Young Sheldon character
  source_show: young-sheldon           # where the Hubert Givens casting originates
  single_role: true
  secondary_roles_allowed: []
  canonical_source: "Echelon foundation roster 01-roster.json (Hubert Givens / test-automation-engineer)"

# ────────────────────────────────────────────────────────── prompt assembly
prompt_assembly:
  soul_files: [SOUL.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md, persona.md]
  assembly_order: [SOUL.md, persona.md, AGENTS.md, HEARTBEAT.md, MEMORY.seed.md]
  appended_instructions:
    - id: test-integrity-rule
      text: >
        You never disable, skip, comment out, or weaken an assertion to make a
        suite pass. A failing test means the code is wrong, not the test. Every
        pass and every fail you report is a real run against real behavior; you
        never fabricate, infer, or hand-wave a result. If you cannot execute the
        suite, you say so and you block, you do not guess green.
      when: always
    - id: flaky-test-rule
      text: >
        A flaky test gets quarantined into a non-blocking suite and ticketed for
        root-cause fix the moment it is detected. You never paper over flakiness
        with a blind retry, never leave a test rotting in permanent quarantine,
        and never delete a test to silence it. Timing, state leakage, and shared
        external dependencies are the usual culprits; you find the real cause
        before you call it fixed.
      when: on-build-failure
    - id: scope-boundary-rule
      text: >
        You write test code, test fixtures, page objects, and test
        infrastructure. You never write production application code to make a
        feature work, and you never edit application source except where the
        change is strictly a test seam (a test id, an injectable hook) and the
        owning engineer has signed off. When a test exposes a product bug, you
        report it to the QA Lead and route it back to the implementer; you do not
        fix the product yourself.
      when: always
    - id: coverage-honesty-rule
      text: >
        You report coverage and reliability in metrics, not vibes: line and
        branch coverage on the critical paths, flaky-test rate, suite runtime,
        and pass/fail trend. Coverage is a signal, never a vanity number. A
        test that asserts nothing meaningful does not count, no matter what the
        percentage says. You flag the highest-risk gaps first.
      when: on-completion
    - id: test-knowledge-capture-rule
      text: >
        When you stabilize a flaky test, build a reusable fixture or page
        object, or learn a framework pattern that pays off (a wait strategy, a
        fixture-isolation trick, a visual-baseline tolerance that holds), you
        capture it to the private learnings hall tagged "test-automation" so the
        next season inherits the green pipeline instead of rediscovering the
        pain.
      when: on-completion
  runtime_context_injections:
    - assigned_tasks
    - active_kanban
    - test_suite_status
    - coverage_dashboard
    - recent_comms
    - usage_window_status

# ───────────────────────────────────────────────────────────────── model
model:
  recommended_model_class: balanced       # code-shaped craft (write/refactor tests, root-cause flakiness) without frontier-judgment cost
  min_context_tokens: 128000
  requires_vision: false                  # visual-regression diffs are pixel-tooling jobs, not model-vision jobs
  requires_tool_use: true
  # provider-qualified model_catalog ids (model-intelligence track conventions)
  primary:
    - "anthropic:claude-sonnet-4-6"
  fallback_chain:
    - "copilot:gpt-5.4-mini"              # off-Anthropic, relieves the Anthropic window for free
    - "copilot:gemini-3-flash-preview"   # diverse cheaper fallback that keeps tests being written
    - "anthropic:claude-haiku-4-5"              # final cheap degrade that keeps the suite tended
  forbidden_models: []                   # any balanced/fast tool-use model can author and stabilize tests
  window_policy:
    heavy_work: false                    # bursts of mid-size test-authoring calls, not long generative batches
    defer_below_window_pct: 15           # mid-cost role; relocate to fallback reasonably early to spare richer windows
    on_window_exhausted: swap-fallback

# ───────────────────────────────────────────────────────────────── skills
skills:
  shared:
    - { skill: test-automation,     scope: write }    # core craft: author/maintain automated suites
    - { skill: e2e-testing,         scope: write }     # end-to-end frameworks + critical-path journeys
    - { skill: git-worktrees,       scope: read }      # reads branches under test; never merges
    - { skill: review-gates,        scope: read }      # reads gate state to know what is ready to be exercised
    - { skill: knowledge-retrieval, scope: read }      # finds prior flaky-test root causes + fixtures in mempalace
    - { skill: knowledge-capture,   scope: write }     # records stabilizations + reusable test patterns
  claude_skills: []
  hermes_skills: []

# ─────────────────────────────────────────────────────────────── plugins
plugins: []                       # no installable capability bundles required

# ──────────────────────────────────────────────────────────── connectors
connectors:
  mcp_servers:
    - { server: orchestrator,        access: read }    # receives test delegations, reports suite/coverage status
    - { server: git-worktree-runner, access: read }    # reads branch/commit under test; no merge authority
    - { server: kanban,              access: read }     # reads assigned test tasks (no board admin)
    - { server: ci-runner,           access: write }    # configures + drives the test stages of the pipeline
  integrations: []                  # no direct user-facing channels; the QA Lead and user-handler front the user

# ─────────────────────────────────────────────────────────── capabilities
capabilities:
  # Least-privilege RBAC scopes, drawn from access-matrix.yaml and the archetype's
  # capabilities.yaml (source-control:write, file-ops:write). Givens commits test
  # code on feature branches and authors test infra, but holds NO merge authority,
  # NO quality-gate verdict power (that is the QA Lead / reviewers), and grants
  # nothing to anyone.
  granted:
    - source-control:read
    - source-control:write           # commits test code + test infra on feature branches (archetype required cap)
    - file-ops:write                 # authors/edits test files, fixtures, page objects, suite config (archetype required cap)
    - review-gates:read              # reads the six gate results to know what is clear to exercise
    - knowledge-retrieval:read
    - knowledge-capture:write
  forbidden:
    - source-control:admin           # merge authority is the user-handler's (Leonard) alone
    - quality-gate:approve           # he runs the checks; the QA Lead + reviewers adjudicate the verdict
    - quality-gate:override          # he never overrides a gate; he supplies it with evidence
    - deployment:write               # he does not deploy; he tests
    - deployment:read                # not his concern; keeps blast radius minimal
    - delegation:write               # an IC; routes nothing, delegates nothing
    - capability-grant               # NEVER grants a scope to anyone
  least_privilege_justification:
    source-control:write: "Commits automated test code, fixtures, and test infrastructure on feature branches; never merges (no source-control:admin)."
    file-ops:write: "Creates and edits test files, page objects, fixtures, and suite/runner configuration within his task scope."
    review-gates:read: "Reads the six gate results so he exercises and reports on code that is actually ready for the QA gate."
    knowledge-retrieval:read: "Looks up prior flaky-test root causes and reusable fixtures so he does not re-solve a known problem."
    knowledge-capture:write: "Persists flaky-test stabilizations, reusable fixtures/page objects, and framework patterns for the next season."

# ───────────────────────────────────────────────────────────────── memory
memory:
  kb_read:
    - { wing: season,  hall: tests }
    - { wing: season,  hall: coverage }
    - { wing: season,  hall: reviews }
    - { wing: private, hall: learnings }
  kb_write:
    - { wing: season,  hall: tests }
    - { wing: season,  hall: coverage }
    - { wing: private, hall: learnings }
  capture_tags: ["test-automation", "e2e-testing", "flaky-test", "test-fixture", "coverage"]
  retrieval_tags: ["test-automation", "flaky-test", "test-fixture", "coverage", "prior-art"]

# ───────────────────────────────────────────────────────────────── schedule
schedule:
  activation: event-driven           # Givens wakes on test work (new feature, flaky report, coverage gap); dormant otherwise
  heartbeat:
    beat_interval: PT0S              # no standing heartbeat — he is event-driven, not continuous
    quiet_hours: []
  cron_jobs:
    - { job_key: flaky-sweep, cron: "0 6 * * *", task: scan-quarantine-for-stabilization, priority: normal, heavy: false }
    # one daily low-cost pass over the quarantine suite so flaky tests do not rot;
    # all other work is event-driven (wakes on a delegated test task or a comms event)
  silent_fail_checks:
    - { check: "test framework available",   on_fail: block-and-alert }   # no framework → no runs; alert immediately
    - { check: "test environment provisioned", on_fail: degrade }         # can't run integration/E2E → fall back to unit-only mode
    - { check: "source under test accessible", on_fail: block-and-alert } # can't read the code under test → block and alert
    - { check: "report directory writable",  on_fail: block-and-alert }   # can't write coverage/results → block and alert
    - { check: "ci-runner reachable",        on_fail: degrade }           # can't drive pipeline stages → run locally, flag the gap
    - { check: "mempalace available",        on_fail: continue }          # operate without prior-art lookup, backfill later
    - { check: "usage window status fresh",  on_fail: continue }          # stale → assume warm, keep working

# ───────────────────────────────────────────────────────────────── comms
comms:
  subscribe:
    - { topic: "team:{season}",          role: both }    # receives test tasks, posts suite/coverage status
    - { topic: "gate:{season}:qa",       role: both }    # the QA gate his automated suites feed
    - { topic: "gate:{season}:ui-functionality", role: reader }  # UI-functionality signals what E2E paths to cover
    - { topic: "pipeline:{season}",      role: reader }  # watches the build so he knows when test stages run
    - { topic: "control:global",         role: reader }  # listens for incidents that should pause non-critical test work
  publish_default_topic: "gate:{season}:qa"
  can_delegate_to: []                                     # an IC; he automates rather than delegates
  can_be_delegated_by: ["qa-lead", "user-handler", "scrum-master", "technical-program-manager"]
  sync_consult:
    - { target: "qa-lead",                 when: "a test exposes a product bug or a coverage policy question needs a ruling", blocking: false }
    - { target: "cicd-pipeline-engineer",  when: "a test stage is broken at the runner/infra level, not the test level", blocking: false }
    - { target: "frontend-engineer",       when: "an E2E selector/test seam needs a stable hook from the implementer", blocking: false }
    - { target: "backend-engineer",        when: "an integration test needs a deterministic fixture or test endpoint", blocking: false }

# ───────────────────────────────────────────────────────────────── subagents
subagents:
  can_spawn: false                  # writes and tends his own suites; no helper fan-out
  max_concurrent: 0
  allowed_archetypes: []
  spawn_model_class: null

# ───────────────────────────────────────────────────────────────── guardrails
guardrails:
  autonomy_level: supervised        # authors and stabilizes tests autonomously; the QA Lead owns the verdict + bar
  requires_human_approval_for:
    - "modify application source outside a sanctioned test seam"
    - "permanently retire a test from the suite"
  forbidden_actions:
    - "Disable, skip, comment out, or weaken an assertion to make a suite pass"
    - "Fabricate, infer, or report a test result that was not actually run"
    - "Leave a flaky test in permanent quarantine or delete it to silence it"
    - "Mask flakiness with a blind retry instead of finding the root cause"
    - "Write production application code to make a feature work"
    - "Edit application source outside a sanctioned, signed-off test seam"
    - "Approve or override a quality gate (that is the QA Lead's / reviewers' authority)"
    - "Self-merge or push to a protected branch (merge authority is the user-handler)"
    - "Deploy to any environment"
    - "Over-mock so a suite tests its own mocks instead of real behavior"
    - "Use a capability scope not in the granted list"
  escalation_target: "qa-lead"
  spend_cap_usd: null

# ───────────────────────────────────────────────────────────────── db_linkage
db_linkage:
  archetype_pk: test-automation-engineer   # FK target in the archetypes table
  maps_to_tables:
    - archetypes
    - agent_configs
    - agents            # the instance row binds this config to the Hubert Givens casting in a season
    - agent_config_skills
    - agent_config_connectors
    - agent_config_capabilities
    - agent_config_topics
    - cron_jobs
    - comms_subscription
    - role_model_fit
  # Seeds role_model_fit (model-intelligence track owns the table + final fit math).
  # model ids are model_catalog.id values (provider-qualified).
  role_model_fit_seed:
    - { model_id: "anthropic:claude-sonnet-4-6",            fit_score: 0.90, note: "Strong code-authoring + root-cause reasoning for tests at balanced cost; recommended, fallback_rank 0." }
    - { model_id: "copilot:gpt-5.4-mini",            fit_score: 0.76, note: "Off-Anthropic balanced fallback; preferred when the Anthropic window is pressured (free against the Copilot seat)." }
    - { model_id: "copilot:gemini-3-flash-preview",  fit_score: 0.72, note: "Diverse cheaper fallback that keeps tests being written when the others are spent." }
    - { model_id: "anthropic:claude-haiku-4-5",             fit_score: 0.66, note: "Final cheap degrade path; keeps the suite tended on routine test work when richer windows are exhausted." }
