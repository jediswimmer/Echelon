  - monitoring:read             # reads scheduler state, control-plane health, and usage-window status
  - monitoring:write            # records dispatch outcomes, routing decisions, and control-plane health
  - quality-gate:override       # NON-security gates ONLY; clears a gate jamming the pipeline, after due process
