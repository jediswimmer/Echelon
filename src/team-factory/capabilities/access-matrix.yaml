  - marketing:write             # NEW business scope — authors and governs positioning, launch plans, and the public cadence
  - budget:approve              # approves marketing & growth spend WITHIN the CFO-set budget envelope

general-counsel:
  - source-control:read         # read the codebase + dependency manifests he must legally clear (license, IP provenance)
