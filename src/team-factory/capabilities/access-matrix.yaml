# capabilities/access-matrix.yaml
# RBAC matrix: archetype → scoped shared-skills
# Format: <skill>:<scope> where scope is read | write | admin | execute | approve |
#         reject | escalate | rate | override | onboard
# Coverage: every one of the 70 archetypes under archetypes/ has exactly one row
#           here (advisory-board-sme is represented by the _advisory_board block).
#
# ---------------------------------------------------------------------------
# ACCEPTED SCOPE VOCABULARY
# The authoritative set of capability scopes any archetype row may reference.
# A scope used in an agent.config.yaml MUST appear here before it is granted.
# ---------------------------------------------------------------------------
# Engineering / delivery core:
#   source-control:read | source-control:write | source-control:admin
#   git-worktrees:write
#   file-ops:write
#   deployment:read | deployment:write
#   monitoring:read | monitoring:write
#   prd-intake:write
# Review + quality gates:
#   review-gates:read              # reads the six parallel review-gate results
#   review-gates:write             # writes gate feedback into the review line
#   quality-gate:read              # reads a gate verdict without acting on it
#   quality-gate:rate              # rating gates (adversarial, ui-functionality) emit a 1-5 score
#   quality-gate:approve | quality-gate:reject | quality-gate:escalate | quality-gate:override
# Orchestration + knowledge:
#   inter-agent-protocol:admin | inter-agent-protocol:execute
#   delegation:read | delegation:write
#   knowledge-retrieval:read | knowledge-retrieval:write
#   knowledge-capture:write
#   counselor-invocation:execute
#   capability-grant               # control-plane only: provisions/widens scopes
#   policy:admin                   # CEO-stewarded guardrail-policy authorship
# Business / company-scale scopes (Echelon exec + business layer):
#   finance:read                   # finance domain (cost accounting, spend signal)
#   budget:approve                 # spend authority
#   legal:review                   # legal domain (contracts, licensing, compliance)
#   hr:read | hr:write             # people-ops domain (roster, role definitions)
#   sales:write                    # revenue domain (deals, bizdev)
#   marketing:write                # marketing / growth / devrel external content
#   roadmap:admin                  # product roadmap governance (scope in/out, sequence)
#   product:read                   # reads backlog / acceptance criteria / product state
#   design:read                    # reads design artifacts + research synthesis
#   kanban:write                   # manages a board view (e.g. the product roadmap board)
#   vendor:onboard                 # vendor / model-provider acquisition
# ---------------------------------------------------------------------------

